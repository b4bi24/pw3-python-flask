{% extends 'base.html' %}
{% block content %}

<div class="container my-4" style="background-color: azure; border-radius: 8px; padding: 20px;">
    <div class="row g-4"> <!-- g-4 adiciona espaçamento automático entre as colunas -->
        
        {% for jogo in listaJogos %}
        <div class="col-md-3 d-flex align-items-stretch"> <!-- Garante que todos os cards tenham a mesma altura -->
            <div class="card" style="width: 100%;">
                
                <img src="{{jogo.thumbnail}}" class="card-img-top" alt="{{jogo.title}}">
                
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title">{{jogo.title}}</h5>
                        <p class="card-text mb-1"><strong>Gênero:</strong> {{jogo.genre}}</p>
                        <p class="card-text text-muted"><strong>Plataforma:</strong> {{jogo.platform}}</p>
                    </div>

                    <!-- Div para agrupar e alinhar os botões lado a lado na parte inferior -->
                    <div class="d-grid gap-2 mt-3">
                        <a href="{{url_for('apigames', id=jogo.id)}}" class="btn btn-dark">+ Informações</a>
                        <a href="{{jogo.game_url}}" class="btn btn-danger">Jogar</a>
                    </div>
                </div>

            </div>
        </div>
        {% endfor %}

    </div> <!-- Fechamento correto da row FORA do laço for -->
</div> <!-- Fechamento correto do container -->

{% endblock content %}
