{% extends "base.html" %}
{% block title %}Cadastro | Conecta{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="text-center mb-4"><div class="logo-mark">C</div><h1 class="h3 fw-bold">Crie sua conta</h1><p class="text-muted">Compartilhe momentos e converse.</p></div>
  <form method="POST">
    <div class="mb-3"><label class="form-label">Nome / Nickname</label><input class="form-control" name="nome" maxlength="100" required></div>
    <div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" minlength="6" required autocomplete="new-password"><div class="form-text">Mínimo de 6 caracteres.</div></div>
    <button class="btn btn-primary w-100">Cadastrar</button>
  </form>
  <p class="text-center mt-3 mb-0">Já tem uma conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
</div>
{% endblock %}
