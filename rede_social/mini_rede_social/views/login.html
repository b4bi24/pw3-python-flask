{% extends "base.html" %}
{% block title %}Entrar | Conecta{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="text-center mb-4"><div class="logo-mark">C</div><h1 class="h3 fw-bold">Que bom ter você aqui!</h1><p class="text-muted">Entre para ver as novidades da comunidade.</p></div>
  <form method="POST">
    <div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
  <p class="text-center mt-3 mb-0">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
